<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E5A3A">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ibu Cerdas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: satu kolom ala aplikasi HP (maks 480px), konten di tengah, navigasi bawah tetap, lembar isian naik dari bawah. */
:root {
  --bg: #F6F3EA;
  --surface: #FFFFFF;
  --surface2: #EDF1E4;
  --hero: #E1E9D3;
  --sage: #9DB08A;
  --accent: #2E5A3A;
  --on-accent: #FFFFFF;
  --ink: #2A302B;
  --muted: #667064;
  --line: #E0E4D6;
  --income: #2C7A48;
  --expense: #B0503C;
  --overlay: rgba(30, 38, 30, .45);
  --c1: #2E5A3A; --c2: #6E9A5B; --c3: #C29A3C; --c4: #B0503C; --c5: #4F83A0; --c6: #8A72A8; --c7: #8D8A74; --c8: #D08A62; --c9: #3F7F7A; --warn: #8A6A12;
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131712; --surface: #1D231B; --surface2: #262E23; --hero: #243022; --sage: #6F8A5E;
    --accent: #A9C896; --on-accent: #12200F; --ink: #E7EBE1; --muted: #9AA495; --line: #2D3629;
    --income: #7FC594; --expense: #E69580; --overlay: rgba(0, 0, 0, .6);
    --c1: #A9C896; --c2: #78A864; --c3: #D8B45A; --c4: #E69580; --c5: #78AAC6; --c6: #B49CD0; --c7: #B3AF98; --c8: #E8A883; --c9: #7CC1BA; --warn: #E3C16A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131712; --surface: #1D231B; --surface2: #262E23; --hero: #243022; --sage: #6F8A5E;
  --accent: #A9C896; --on-accent: #12200F; --ink: #E7EBE1; --muted: #9AA495; --line: #2D3629;
  --income: #7FC594; --expense: #E69580; --overlay: rgba(0, 0, 0, .6);
    --c1: #A9C896; --c2: #78A864; --c3: #D8B45A; --c4: #E69580; --c5: #78AAC6; --c6: #B49CD0; --c7: #B3AF98; --c8: #E8A883; --c9: #7CC1BA; --warn: #E3C16A;
  color-scheme: dark;
}
:root.big { font-size: 19px; }
* { box-sizing: border-box; }
html { font-size: 16px; }
:root.big { font-size: 19px; }
body {
  background: var(--bg); color: var(--ink); font: 400 1rem/1.5 var(--font);
  padding-block: 20px 120px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.shell { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; line-height: 1.2; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }

.top { display: flex; flex-direction: column; gap: 2px; }
.top h1 { font-size: 1.5rem; font-weight: 800; color: var(--accent); letter-spacing: -.01em; }
.top p { margin: 0; color: var(--muted); font-size: .85rem; }

.hero { background: var(--hero); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 4px; }
.eyebrow { font-size: .72rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.hero .eyebrow { color: var(--accent); }
.hero .big { font-size: 2.1rem; font-weight: 800; color: var(--accent); letter-spacing: -.02em; line-height: 1.15; overflow-wrap: anywhere; }
.hero .hint { font-size: .8rem; color: var(--muted); }

.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat .lbl { display: flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--muted); }
.stat .val { font-size: 1.1rem; font-weight: 800; overflow-wrap: anywhere; }
.stat.in svg, .stat.in .val { color: var(--income); }
.stat.out svg, .stat.out .val { color: var(--expense); }
.stat .val { color: var(--ink); }

.sec { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec h2 { font-size: 1.1rem; font-weight: 800; }
.link { color: var(--accent); font-weight: 700; font-size: .9rem; padding: 6px 0; }

.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px 6px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-weight: 700; font-size: .85rem; position: relative; min-width: 0; min-height: 88px; justify-content: center; }
.tile svg { color: var(--accent); }
.tile:active { background: var(--surface2); }
.tile.soon { color: var(--muted); }
.tile.soon svg { color: var(--sage); }
.tile .tag { position: absolute; top: 6px; right: 6px; font-size: .62rem; font-weight: 700; background: var(--surface2); color: var(--muted); border-radius: 999px; padding: 1px 7px; }

.list { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; border-top: 1px solid var(--line); min-height: 64px; }
.row:first-child { border-top: 0; }
.row:active { background: var(--surface2); }
.ico { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--surface2); }
.row.income .ico { color: var(--income); }
.row.expense .ico { color: var(--expense); }
.row .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .s { font-size: .8rem; color: var(--muted); }
.row .amt { font-weight: 800; white-space: nowrap; }
.row.income .amt { color: var(--income); }
.row.expense .amt { color: var(--expense); }
.day { font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 6px 4px -8px; }
.empty { padding: 28px 18px; text-align: center; color: var(--muted); }

.seg { display: flex; background: var(--surface2); border-radius: 999px; padding: 4px; gap: 4px; }
.seg button { flex: 1; padding: 10px 8px; border-radius: 999px; font-weight: 700; font-size: .9rem; color: var(--muted); min-height: 44px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

.bars { display: flex; flex-direction: column; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; }
.bar .h { display: flex; justify-content: space-between; gap: 10px; font-size: .9rem; margin-bottom: 6px; }
.bar .h b { font-weight: 700; }
.bar .h span { color: var(--muted); white-space: nowrap; }
.track { height: 12px; background: var(--surface2); border-radius: 999px; overflow: hidden; }
.fill { height: 100%; background: var(--sage); border-radius: 999px; }
.bar:first-child .fill { background: var(--accent); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card h3 { font-size: 1rem; }
.card p { margin: 0; color: var(--muted); font-size: .9rem; }
.btn { background: var(--accent); color: var(--on-accent); font-weight: 800; border-radius: 999px; padding: 14px 20px; min-height: 52px; width: 100%; font-size: 1rem; }
.btn.ghost { background: var(--surface2); color: var(--ink); }
.btn.danger { background: var(--expense); color: #fff; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; min-height: 48px; }
.sw { flex: none; width: 52px; height: 30px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s; }
.toggle[aria-pressed="true"] .sw { background: var(--accent); }
.toggle[aria-pressed="true"] .sw::after { transform: translateX(22px); }

nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
nav .in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; }
nav button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; font-size: .72rem; font-weight: 600; color: var(--muted); min-height: 52px; justify-content: center; }
nav button[aria-current="page"] { color: var(--accent); font-weight: 800; }
nav .add { color: var(--accent); }
nav .add .circle { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; margin-top: -26px; box-shadow: 0 6px 16px rgba(30, 60, 35, .3); }

.overlay { position: fixed; inset: 0; z-index: 30; background: var(--overlay); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 480px; max-height: 94%; overflow-y: auto; background: var(--bg); border-radius: 28px 28px 0 0;
  padding: 18px 18px calc(22px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
.sheet header { display: flex; align-items: center; justify-content: space-between; }
.sheet h2 { font-size: 1.2rem; font-weight: 800; }
.x { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface2); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .l { font-size: .85rem; font-weight: 700; color: var(--muted); }
.in-box { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 14px; font: inherit; color: var(--ink); width: 100%; min-height: 52px; }
.amtwrap { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 0 14px; }
.amtwrap span { font-weight: 800; color: var(--muted); font-size: 1.2rem; }
.amtwrap input { border: 0; background: none; font: 800 1.6rem/1 var(--font); color: var(--ink); width: 100%; padding: 14px 0; min-width: 0; }
.amtwrap input:focus-visible { outline: none; }
.amtwrap:focus-within { border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 10px 14px; border-radius: 999px; background: var(--surface); border: 1.5px solid var(--line); font-weight: 600; font-size: .9rem; min-height: 44px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.err { color: var(--expense); font-weight: 600; font-size: .9rem; margin: 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 999px; font-weight: 600; font-size: .9rem; max-width: calc(100% - 32px); text-align: center; }
.chartcard { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 10px; }
.chartcard .empty { padding: 18px 8px; }
.grid { stroke: var(--line); stroke-width: 1; }
.ax { fill: var(--muted); font: 600 11px var(--font); }
.ax.today { fill: var(--accent); font-weight: 800; }
.ctr { fill: var(--ink); font: 800 17px var(--font); }
.c-in { fill: var(--income); }
.c-out { fill: var(--expense); }
.legend { display: flex; justify-content: center; gap: 18px; font-size: .85rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
.sw-in { background: var(--income); }
.sw-out { background: var(--expense); }
.back { display: inline-flex; align-items: center; gap: 2px; color: var(--accent); font-weight: 700; min-height: 44px; align-self: flex-start; margin-bottom: -10px; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .75rem; font-weight: 700; background: var(--surface2); color: var(--muted); white-space: nowrap; }
.pill.ok { color: var(--income); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--expense); }
.alerts { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.alert { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 12px 14px; border-top: 1px solid var(--line); min-height: 56px; font-weight: 600; font-size: .92rem; }
.alert:first-child { border-top: 0; }
.alert svg { flex: none; } .alert.warn svg { color: var(--warn); } .alert.bad svg { color: var(--expense); }
.fc { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; text-align: left; width: 100%; }
.fc .v { font-size: 1.5rem; font-weight: 800; overflow-wrap: anywhere; }
.fc .m { color: var(--muted); font-size: .85rem; }
.meter { display: block; height: 10px; background: var(--surface2); border-radius: 999px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.meter.warn i { background: var(--warn); } .meter.bad i { background: var(--expense); }
.item { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-top: 1px solid var(--line); text-align: left; width: 100%; }
.item:first-child { border-top: 0; }
.irow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.irow .n { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.m { color: var(--muted); font-size: .85rem; }
.mini { padding: 8px 16px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: .85rem; min-height: 40px; }
.mini.ghost { background: var(--surface2); color: var(--ink); }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.chk { flex: none; width: 32px; height: 32px; border-radius: 10px; border: 2px solid var(--sage); display: grid; place-items: center; color: var(--on-accent); }
.chk[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.done { text-decoration: line-through; color: var(--muted); }
.tiles.two { grid-template-columns: 1fr 1fr; }
.calhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.calhead b { font-size: 1.05rem; text-transform: capitalize; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .h { text-align: center; font-size: .72rem; font-weight: 700; color: var(--muted); padding: 2px 0; }
.cell { aspect-ratio: 1 / 1; max-width: 100%; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 600; font-size: .9rem; background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.cell.today { outline: 2px solid var(--sage); }
.cell[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.dots { display: flex; gap: 3px; height: 6px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; box-shadow: 0 0 0 1px var(--surface); }
.d-in { background: var(--income); } .d-out { background: var(--expense); } .d-bill { background: var(--warn); }
.step { display: flex; align-items: center; gap: 8px; }
.step button { width: 40px; height: 40px; border-radius: 50%; background: var(--surface2); display: grid; place-items: center; font-weight: 800; font-size: 1.2rem; }
.lines { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.lines li { padding-left: 14px; position: relative; font-size: .95rem; }
.lines li::before { content: ""; position: absolute; left: 0; top: .6em; width: 6px; height: 6px; border-radius: 50%; background: var(--sage); }
.ln-a { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.ln-p { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 5 4; }
.zero { stroke: var(--muted); stroke-width: 1; }
select.in-box { appearance: auto; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="shell" id="app"></div>

<nav aria-label="Menu utama"><div class="in" id="nav"></div></nav>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <header><h2 id="sheetTitle">Catat transaksi</h2><button class="x" data-act="close" aria-label="Tutup" id="xbtn"></button></header>
    <div class="seg" role="group" aria-label="Jenis transaksi">
      <button data-act="settype" data-type="expense" id="tExp">Pengeluaran</button>
      <button data-act="settype" data-type="income" id="tInc">Pemasukan</button>
    </div>
    <div class="field"><label for="amt">Jumlah</label>
      <div class="amtwrap"><span>Rp</span><input id="amt" inputmode="numeric" autocomplete="off" placeholder="0"></div></div>
    <div class="field"><span class="l">Kategori</span><div class="chips" id="chips"></div></div>
    <div class="field"><label for="note">Keterangan</label><input class="in-box" id="note" maxlength="60" placeholder="Contoh: belanja sayur di pasar"></div>
    <div class="field"><label for="date">Tanggal</label><input class="in-box" id="date" type="date"></div>
    <p class="err" id="err" hidden></p>
    <button class="btn" data-act="save">Simpan</button>
    <button class="btn danger" data-act="del" id="delbtn" hidden>Hapus catatan</button>
  </div>
</div>
<div class="overlay" id="foverlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ftitle">
    <header><h2 id="ftitle">Isi data</h2><button class="x" data-act="fclose" aria-label="Tutup" id="fx"></button></header>
    <div id="ffields" style="display:flex;flex-direction:column;gap:16px"></div>
    <p class="err" id="ferr" hidden></p>
    <button class="btn" data-act="fsave" id="fsave">Simpan</button>
    <button class="btn danger" data-act="fdel" id="fdel" hidden>Hapus</button>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
var KEY = "ibu-cerdas-v1";
var EXP = ["Belanja dapur", "Listrik", "Air", "Transportasi", "Pulsa & internet", "Pendidikan", "Kesehatan", "Lainnya", "Tabungan"];
var INC = ["Gaji", "Usaha", "Bantuan keluarga", "Lainnya"];
var S = { tx: [], theme: "auto", big: false, sample: false };
var view = "home", filter = "all", range = "month", wipeAsk = false, delAsk = false;
var sheet = { type: "expense", id: null, cat: "Belanja dapur" };
var toastTimer;

var IC = {
  up: '<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
  down: '<path d="M3 7l6 6 4-4 8 8"/><path d="M15 17h6v-6"/>',
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  pie: '<path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
  pig: '<path d="M5 11a7 6 0 0 1 14 0c0 2-1 3.5-2 4.5V19h-3v-2h-4v2H7v-3.5C6 14.5 5 13 5 11z"/><path d="M19 9l2-1M9 8h.01"/>',
  cal: '<rect x="4" y="5" width="16" height="16" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>'
};
function svg(n, s) { s = s || 22; return '<svg viewBox="0 0 24 24" width="' + s + '" height="' + s + '" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + IC[n] + '</svg>'; }

function $(s) { return document.querySelector(s); }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function rp(n) { return "Rp" + Math.abs(n).toLocaleString("id-ID"); }
function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }

  var top = niceMax(mx), L = 46, R = 8, T = 10, B = 24, W = 340, H = 170, pw = W - L - R, ph = H - T - B, gw = pw / 7, bw = Math.min(14, gw / 2 - 3);

function saveSheet() {

  if (amount <= 0) { err.textContent = "Isi jumlah uang lebih dari nol."; err.hidden = false; return; }
  if (!date) { err.textContent = "Pilih tanggal transaksi."; err.hidden = false; return; }

  if (sheet.id) {

document.addEventListener("click", function (e) {
  if (e.target.id === "overlay") { closeSheet(); return; }
  var el = e.target.closest("[data-act]"); if (!el) return;
  var a = el.dataset.act;
  if (a.indexOf("nav-") === 0) go(a.slice(4));
  else if (a === "add-out") openSheet(null, "expense");
  else if (a === "add-in") openSheet(null, "income");
  else if (a === "edit") openSheet(el.dataset.id);
  else if (a === "close") closeSheet();
  else if (a === "settype") { sheet.type = el.dataset.type; drawSheet(); }
  else if (a === "cat") { sheet.cat = el.dataset.cat; drawSheet(); }
  else if (a === "save") saveSheet();
  else if (a === "del") {
    if (!delAsk) { delAsk = true; el.textContent = "Ketuk lagi untuk menghapus"; return; }
    S.tx = S.tx.filter(function (t) { return t.id !== sheet.id; }); S.sample = false; save(); closeSheet(); render(); toast("Catatan dihapus");
  }
  else if (a === "filter") { filter = el.dataset.f; render(); }
  else if (a === "range") { range = el.dataset.r; render(); }
  else if (a === "theme") { S.theme = el.dataset.t; save(); applyTheme(); render(); }
  else if (a === "big") { S.big = !S.big; save(); applyTheme(); render(); }
  else if (a === "reset") { seed(); save(); render(); toast("Data contoh dipulihkan"); }
  else if (a === "wipe") {
    if (!wipeAsk) { wipeAsk = true; render(); return; }
    S.tx = []; clearExtras(); S.sample = false; wipeAsk = false; save(); render(); toast("Semua catatan dihapus");
  }
  else if (a === "soon-2") toast("Tabungan hadir di Versi 2");
  else if (a === "soon-3") toast("Pengingat tagihan hadir di Versi 3");
});

function billInfo(b) {
  var n = new Date(), dim = daysIn(n.getFullYear(), n.getMonth()), day = Math.min(b.day, dim);
  var due = new Date(n.getFullYear(), n.getMonth(), day), t0 = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  var diff = Math.round((due - t0) / 864e5), paid = b.paid === TODAY.slice(0, 7);
  var label, cls;
  if (paid) { label = "Lunas bulan ini"; cls = "ok"; }
  else if (diff < 0) { label = "Terlambat " + (-diff) + " hari"; cls = "bad"; }
  else if (diff === 0) { label = "Jatuh tempo hari ini"; cls = "bad"; }
  else if (diff <= 3) { label = diff + " hari lagi"; cls = "warn"; }
  else { label = diff + " hari lagi"; cls = ""; }
  return { diff: diff, paid: paid, label: label, cls: cls };
}

/* asisten: prediksi, ringkasan, saran */
function forecast() {
  var n = new Date(), dom = n.getDate(), dim = daysIn(n.getFullYear(), n.getMonth());
  var out = sum(S.tx.filter(inMonth), "expense"), bal = sum(S.tx, "income") - sum(S.tx, "expense");
  var avg = out / dom, remain = dim - dom, spend = Math.round(avg * remain);
  var bills = S.bills.filter(function (b) { var i = billInfo(b); return !i.paid && i.diff >= 0; }).reduce(function (a, b) { return a + b.amount; }, 0);
  return { bal: bal, avg: avg, remain: remain, dom: dom, dim: dim, spend: spend, bills: bills, end: bal - spend - bills, out: out };
}
function chartForecast(f) {
  var pre = TODAY.slice(0, 7);
  function net(upTo) { return S.tx.filter(function (t) { return t.date.slice(0, 7) === pre && t.date <= upTo; }).reduce(function (a, t) { return a + (t.type === "income" ? t.amount : -t.amount); }, 0); }
  var start = f.bal - net(pre + "-31"), act = [], prj = [], d, vals = [];
  for (d = 1; d <= f.dom; d++) { var v = start + net(pre + "-" + String(d).padStart(2, "0")); act.push([d, v]); vals.push(v); }
  prj.push([f.dom, f.bal]);
  for (d = f.dom + 1; d <= f.dim; d++) { var pv = f.bal - (f.spend + f.bills) * (d - f.dom) / Math.max(f.remain, 1); prj.push([d, pv]); vals.push(pv); }
  var hi = Math.max.apply(null, vals.concat([1])), lo = Math.min.apply(null, vals.concat([0]));
  var top = niceMax(hi), bot = lo < 0 ? -niceMax(-lo) : 0;
  var W = 340, H = 170, L = 46, R = 10, T = 12, B = 24, pw = W - L - R, ph = H - T - B;
  function X(day) { return L + pw * (day - 1) / Math.max(f.dim - 1, 1); }
  function Y(val) { return T + ph - ph * (val - bot) / (top - bot); }
  function path(a) { return a.map(function (p, i) { return (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1); }).join(" "); }
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Grafik saldo bulan ini dan perkiraan sampai akhir bulan" style="width:100%;height:auto;display:block">';
  [bot, (bot + top) / 2, top].forEach(function (t) { s += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(t) + '" y2="' + Y(t) + '"/><text class="ax" x="' + (L - 6) + '" y="' + (Y(t) + 4) + '" text-anchor="end">' + (t < 0 ? "-" : "") + short(Math.abs(t)) + '</text>'; });
  if (bot < 0) s += '<line class="zero" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(0) + '" y2="' + Y(0) + '"/>';
  s += '<path class="ln-a" d="' + path(act) + '"/>';
  if (f.remain > 0) s += '<path class="ln-p" d="' + path(prj) + '"/>';
  s += '<circle cx="' + X(f.dom) + '" cy="' + Y(f.bal) + '" r="4.5" fill="var(--accent)"/>';
  if (f.remain > 0) s += '<circle cx="' + X(f.dim) + '" cy="' + Y(f.end) + '" r="4.5" fill="' + (f.end < 0 ? "var(--expense)" : "var(--income)") + '"/>';
  [1, f.dom, f.dim].forEach(function (dd, i, arr) { if (i && dd === arr[i - 1]) return; s += '<text class="ax' + (dd === f.dom ? " today" : "") + '" x="' + X(dd) + '" y="' + (H - 6) + '" text-anchor="' + (dd === 1 ? "start" : dd === f.dim ? "end" : "middle") + '">tgl ' + dd + '</text>'; });
  return s + '</svg>';
}
function summaryLines() {
  var mon = S.tx.filter(inMonth), inc = sum(mon, "income"), out = sum(mon, "expense"), L = [];
  var by = {};
  mon.filter(function (t) { return t.type === "expense"; }).forEach(function (t) { by[t.cat] = (by[t.cat] || 0) + t.amount; });
  var cats = Object.keys(by).sort(function (a, b) { return by[b] - by[a]; });
  if (!out) return ["Belum ada pengeluaran bulan ini. Catat transaksi pertama agar asisten bisa membantu."];
  L.push("Pengeluaran bulan ini " + rp(out) + (inc ? ", atau " + Math.round(out / inc * 100) + "% dari pemasukan." : "."));
  L.push("Kategori terbesar adalah " + cats[0] + " (" + Math.round(by[cats[0]] / out * 100) + "% dari pengeluaran).");
  L.push("Rata-rata pengeluaran " + rp(Math.round(out / new Date().getDate())) + " per hari.");
  var n = new Date(), lp = ymd(new Date(n.getFullYear(), n.getMonth() - 1, 1)).slice(0, 7), lb = {};
  S.tx.filter(function (t) { return t.type === "expense" && t.date.slice(0, 7) === lp; }).forEach(function (t) { lb[t.cat] = (lb[t.cat] || 0) + t.amount; });
  cats.forEach(function (c) { if (lb[c] && by[c] > lb[c] * 1.2 && by[c] - lb[c] >= 20000) L.push(c + " naik " + Math.round((by[c] / lb[c] - 1) * 100) + "% dibanding bulan lalu."); });
  return L;
}
function tips() {
  var mon = S.tx.filter(inMonth), inc = sum(mon, "income"), out = sum(mon, "expense"), t = [], by = {};
  mon.filter(function (x) { return x.type === "expense"; }).forEach(function (x) { by[x.cat] = (by[x.cat] || 0) + x.amount; });
  var cats = Object.keys(by).sort(function (a, b) { return by[b] - by[a]; });
  var adv = {
    "Belanja dapur": "Tulis daftar belanja sebelum ke pasar dan bandingkan harga di dua tempat.",
    "Lainnya": "Pecah kategori Lainnya menjadi pos yang jelas, lalu beri batas jajan mingguan.",
    "Pulsa & internet": "Cek apakah paket internet dan pulsa yang dipakai sudah paling pas.",
    "Transportasi": "Gabungkan beberapa keperluan dalam satu perjalanan."
  };
  if (cats.length) { var share = Math.round(by[cats[0]] / out * 100); if (share >= 35 && cats[0] !== "Tabungan") t.push(cats[0] + " memakai " + share + "% pengeluaran bulan ini. " + (adv[cats[0]] || "Coba tentukan batasnya di Anggaran.")); }
  var sav = by["Tabungan"] || 0;
  if (inc > 0 && sav < inc * 0.1) t.push("Tabungan baru " + Math.round(sav / inc * 100) + "% dari pemasukan. Coba sisihkan sekitar " + rp(Math.round(inc * 0.1 / 1000) * 1000) + " (10%) di awal bulan lewat Target Keuangan.");
  EXP.forEach(function (c) {
    var b = budgetState(c);
    if (b.lim && b.p >= 1) t.push("Amplop " + c + " lewat batas " + rp(b.u - b.lim) + ". Kurangi pemakaiannya sampai akhir bulan.");
    else if (b.lim && b.p >= 0.8) t.push("Amplop " + c + " tinggal " + rp(b.lim - b.u) + ". Tahan dulu pengeluaran yang belum mendesak.");
  });
  if (!Object.keys(S.budgets).length) t.push("Belum ada batas pengeluaran. Atur amplop di Anggaran agar kamu diingatkan lebih awal.");
  var low = S.stock.filter(function (s) { return s.qty <= s.min; }).length;
  if (low) t.push(low + " barang persediaan menipis. Masukkan ke Daftar Belanja agar tidak membeli mendadak dengan harga lebih mahal.");
  if (!t.length) t.push("Pengeluaranmu terkendali. Pertahankan kebiasaan mencatat di hari yang sama.");
  return t;
}
function renderAssist() {
  var f = forecast();
  return subHead("Asisten Keuangan", "Perkiraan dan saran berdasarkan catatanmu bulan ini.") +
    '<section class="hero"><span class="eyebrow">Perkiraan sisa uang akhir bulan</span><span class="big num" style="color:' + (f.end < 0 ? "var(--expense)" : "var(--accent)") + '">' + (f.end < 0 ? "-" : "") + rp(f.end) + '</span>' +
    '<span class="hint">' + (f.end < 0 ? "Uangmu berisiko kurang sebelum bulan berakhir." : "Uangmu diperkirakan cukup sampai akhir bulan.") + '</span></section>' +
    '<div class="chartcard">' + chartForecast(f) + '<div class="legend"><span><i style="background:var(--accent)"></i>Saldo</span><span><i style="background:var(--muted)"></i>Perkiraan</span></div></div>' +
    '<div class="card"><h3>Cara menghitung</h3><ul class="lines"><li>Saldo sekarang ' + rp(f.bal) + '.</li><li>Sisa ' + f.remain + ' hari dengan rata-rata ' + rp(Math.round(f.avg)) + ' per hari: ' + rp(f.spend) + '.</li><li>Tagihan yang belum dibayar: ' + rp(f.bills) + '.</li></ul></div>' +
    '<div class="card"><h3>Ringkasan bulan ini</h3><ul class="lines">' + summaryLines().map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + '</ul></div>' +
    '<div class="card"><h3>Rekomendasi penghematan</h3><ul class="lines">' + tips().map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + '</ul></div>';

/* beranda: peringatan, prakiraan, menu rumah tangga */
function alertList() {
  var a = [];
  EXP.forEach(function (c) {
    var b = budgetState(c);
    if (b.lim && b.p >= 1) a.push({ cls: "bad", go: "budget", t: "Amplop " + esc(c) + " sudah lewat batas" });
    else if (b.lim && b.p >= 0.8) a.push({ cls: "warn", go: "budget", t: "Amplop " + esc(c) + " hampir habis (" + Math.round(b.p * 100) + "%)" });
  });
  S.bills.forEach(function (b) {
    var i = billInfo(b); if (i.paid || i.diff > 3) return;
    a.push({ cls: i.diff <= 0 ? "bad" : "warn", go: "bills", t: esc(b.name) + " " + (i.diff < 0 ? "terlambat " + (-i.diff) + " hari" : i.diff === 0 ? "jatuh tempo hari ini" : "jatuh tempo " + i.diff + " hari lagi") + " (" + rp(b.amount) + ")" });
  });
  a.sort(function (x, y) { return (y.cls === "bad") - (x.cls === "bad"); });
  return a.slice(0, 4);
}
function homeExtra() {
  var h = "", al = alertList(), f = forecast();
  if (al.length) h += '<div class="alerts">' + al.map(function (x) { return '<button class="alert ' + x.cls + '" data-act="nav-' + x.go + '">' + svg("bell", 22) + '<span>' + x.t + '</span></button>'; }).join("") + '</div>';
  h += '<button class="fc" data-act="nav-assist"><span class="eyebrow">Perkiraan sisa uang akhir bulan</span><span class="v num" style="color:' + (f.end < 0 ? "var(--expense)" : "var(--accent)") + '">' + (f.end < 0 ? "-" : "") + rp(f.end) + '</span><span class="m">Ketuk untuk melihat penjelasan dan saran asisten</span></button>';
  return h;
}
function houseTiles() {
  var t = [["nav-shop", "cart", "Daftar belanja"], ["nav-stock", "box", "Stok rumah"], ["nav-meals", "fork", "Menu masak"], ["nav-chores", "tasks", "Jadwal rumah"]];
  return '<div class="sec"><h2>Rumah tangga</h2></div><div class="tiles two">' + t.map(function (x) { return '<button class="tile" data-act="' + x[0] + '">' + svg(x[1], 26) + '<span>' + x[2] + '</span></button>'; }).join("") + '</div>';
}

var VIEWS = { home: renderHome, tx: renderTx, report: renderReport, profile: renderProfile, budget: renderBudget, goals: renderGoals, bills: renderBills, routine: renderRoutine, cal: renderCal, shop: renderShop, stock: renderStock, meals: renderMeals, chores: renderChores, assist: renderAssist };

/* aksi fitur tambahan */
function goalForm(g) {
  var fields = [{ id: "name", label: "Nama target", type: "text", value: g ? g.name : "", ph: "Contoh: renovasi dapur" }, { id: "target", label: "Jumlah target", type: "money", value: g ? g.target : 0 }];
  if (g) fields.push({ id: "saved", label: "Sudah terkumpul", type: "money", value: g.saved });
  openForm({
    title: g ? "Ubah target" : "Target baru", fields: fields, ok: "Target disimpan",
    save: function (v) {
      if (!v.name) return "Isi nama target."; if (v.target <= 0) return "Isi jumlah target.";
      if (g) { g.name = v.name; g.target = v.target; g.saved = v.saved; } else S.goals.push({ id: uid(), name: v.name, target: v.target, saved: 0 });
    },
    del: g ? function () { S.goals = S.goals.filter(function (x) { return x.id !== g.id; }); } : null, delLabel: "Hapus target"
  });
}
function billForm(b) {
  openForm({
    title: b ? "Ubah tagihan" : "Tagihan baru", ok: "Tagihan disimpan",
    fields: [{ id: "name", label: "Nama tagihan", type: "text", value: b ? b.name : "", ph: "Contoh: listrik" }, { id: "amount", label: "Jumlah", type: "money", value: b ? b.amount : 0 },
      { id: "day", label: "Jatuh tempo tiap tanggal", type: "num", value: b ? b.day : "" }, { id: "cat", label: "Kategori", type: "select", opts: catOpts(), value: b ? b.cat : "Listrik" }],
    save: function (v) {
      if (!v.name) return "Isi nama tagihan."; if (v.amount <= 0) return "Isi jumlah tagihan."; if (v.day < 1 || v.day > 31) return "Isi tanggal antara 1 dan 31.";
      var day = Math.round(v.day);
      if (b) { b.name = v.name; b.amount = v.amount; b.day = day; b.cat = v.cat; } else S.bills.push({ id: uid(), name: v.name, amount: v.amount, day: day, cat: v.cat, paid: "" });
    },
    del: b ? function () { S.bills = S.bills.filter(function (x) { return x.id !== b.id; }); } : null, delLabel: "Hapus tagihan"
  });
}
function routineForm(r) {
  openForm({
    title: r ? "Ubah pengeluaran rutin" : "Pengeluaran rutin baru", ok: "Disimpan",
    fields: [{ id: "name", label: "Nama", type: "text", value: r ? r.name : "", ph: "Contoh: uang saku anak" }, { id: "amount", label: "Jumlah", type: "money", value: r ? r.amount : 0 },
      { id: "cat", label: "Kategori", type: "select", opts: catOpts(), value: r ? r.cat : "Lainnya" }, { id: "freq", label: "Berulang", type: "select", opts: [["week", "Tiap minggu"], ["month", "Tiap bulan"]], value: r ? r.freq : "month" }],
    save: function (v) {
      if (!v.name) return "Isi nama."; if (v.amount <= 0) return "Isi jumlah.";
      if (r) { r.name = v.name; r.amount = v.amount; r.cat = v.cat; r.freq = v.freq; } else S.routines.push({ id: uid(), name: v.name, amount: v.amount, cat: v.cat, freq: v.freq, last: "" });
    },
    del: r ? function () { S.routines = S.routines.filter(function (x) { return x.id !== r.id; }); } : null, delLabel: "Hapus"
  });
}
function shopForm(s) {
  openForm({
    title: s ? "Ubah barang" : "Barang baru", ok: "Barang disimpan",
    fields: [{ id: "name", label: "Nama barang", type: "text", value: s ? s.name : "", ph: "Contoh: bawang merah (kg)" }, { id: "qty", label: "Jumlah", type: "num", value: s ? s.qty : 1 }, { id: "price", label: "Perkiraan harga satuan", type: "money", value: s ? s.price : 0 }],
    save: function (v) {
      if (!v.name) return "Isi nama barang."; if (v.qty <= 0) return "Isi jumlah lebih dari nol.";
      if (s) { s.name = v.name; s.qty = v.qty; s.price = v.price; } else S.shop.push({ id: uid(), name: v.name, qty: v.qty, price: v.price, done: false });
    },
    del: s ? function () { S.shop = S.shop.filter(function (x) { return x.id !== s.id; }); } : null, delLabel: "Hapus barang"
  });
}
function stockForm(s) {
  openForm({
    title: s ? "Ubah barang" : "Barang baru", ok: "Barang disimpan",
    fields: [{ id: "name", label: "Nama barang", type: "text", value: s ? s.name : "", ph: "Contoh: gula" }, { id: "qty", label: "Persediaan sekarang", type: "num", value: s ? s.qty : 1 },
      { id: "unit", label: "Satuan", type: "text", value: s ? s.unit : "", ph: "kg, liter, butir" }, { id: "min", label: "Batas minimal (diingatkan di bawah ini)", type: "num", value: s ? s.min : 1 }],
    save: function (v) {
      if (!v.name) return "Isi nama barang.";
      if (s) { s.name = v.name; s.qty = v.qty; s.unit = v.unit; s.min = v.min; } else S.stock.push({ id: uid(), name: v.name, qty: v.qty, unit: v.unit, min: v.min });
    },
    del: s ? function () { S.stock = S.stock.filter(function (x) { return x.id !== s.id; }); } : null, delLabel: "Hapus barang"
  });
}
function choreForm(c) {
  var opts = [["0", "Setiap hari"]].concat(DOW.map(function (d, i) { return [String(i + 1), d]; }));
  openForm({
    title: c ? "Ubah pekerjaan" : "Pekerjaan baru", ok: "Jadwal disimpan",
    fields: [{ id: "name", label: "Pekerjaan", type: "text", value: c ? c.name : "", ph: "Contoh: mencuci baju" }, { id: "day", label: "Hari", type: "select", opts: opts, value: c ? String(c.day) : "0" }],
    save: function (v) {
      if (!v.name) return "Isi nama pekerjaan.";
      if (c) { c.name = v.name; c.day = parseInt(v.day, 10); } else S.chores.push({ id: uid(), name: v.name, day: parseInt(v.day, 10), doneOn: "" });
    },
    del: c ? function () { S.chores = S.chores.filter(function (x) { return x.id !== c.id; }); } : null, delLabel: "Hapus pekerjaan"
  });
}
function addToShop(names) {
  var added = 0;
  names.forEach(function (nm) {
    nm = nm.trim(); if (!nm) return;
    var has = S.shop.some(function (s) { return s.name.toLowerCase() === nm.toLowerCase(); });
    if (!has) { S.shop.push({ id: uid(), name: nm, qty: 1, price: 0, done: false }); added++; }
  });
  return added;
}

document.addEventListener("click", function (e) {
  if (e.target.id === "foverlay") { closeForm(); return; }
  var el = e.target.closest("[data-act]"); if (!el) return;
  var a = el.dataset.act, id = el.dataset.id;
  if (a === "fclose") closeForm();
  else if (a === "fsave") {
    if (!F) return;
    var err = F.save(formVals());
    if (err) { $("#ferr").textContent = err; $("#ferr").hidden = false; return; }
    var ok = F.ok; closeForm(); commit(); if (ok) toast(ok);
  }
  else if (a === "fdel") {
    if (!fdelAsk) { fdelAsk = true; el.textContent = "Ketuk lagi untuk menghapus"; return; }
    F.del(); closeForm(); commit(); toast("Dihapus");
  }
  else if (a === "bud") {
    var cat = el.dataset.cat;
    openForm({
      title: "Batas " + cat, ok: "Batas disimpan",
      fields: [{ id: "lim", label: "Batas per bulan (kosongkan untuk menghapus)", type: "money", value: S.budgets[cat] || 0 }],
      save: function (v) { if (v.lim > 0) S.budgets[cat] = v.lim; else delete S.budgets[cat]; }
    });
  }
  else if (a === "goal-new") goalForm(null);
  else if (a === "goal-edit") goalForm(byId(S.goals, id));
  else if (a === "goal-add") {
    var g = byId(S.goals, id);
    openForm({
      title: "Tabung untuk " + g.name, saveLabel: "Tabung", ok: "Uang ditabung",
      fields: [{ id: "amount", label: "Jumlah yang ditabung (dicatat sebagai pengeluaran Tabungan)", type: "money", value: 0 }],
      save: function (v) {
        if (v.amount <= 0) return "Isi jumlah yang ditabung.";
        g.saved += v.amount;
        S.tx.push({ id: uid(), type: "expense", amount: v.amount, cat: "Tabungan", note: "Tabung: " + g.name, date: TODAY, c: Date.now() });
      }
    });
  }
  else if (a === "bill-new") billForm(null);
  else if (a === "bill-edit") billForm(byId(S.bills, id));
  else if (a === "bill-pay") {
    var b = byId(S.bills, id);
    b.paid = TODAY.slice(0, 7);
    S.tx.push({ id: uid(), type: "expense", amount: b.amount, cat: b.cat, note: "Bayar " + b.name, date: TODAY, c: Date.now() });
    commit(); toast("Tagihan lunas dan dicatat");
  }
  else if (a === "rt-new") routineForm(null);
  else if (a === "rt-edit") routineForm(byId(S.routines, id));
  else if (a === "rt-do") {
    var r = byId(S.routines, id);
    r.last = TODAY;
    S.tx.push({ id: uid(), type: "expense", amount: r.amount, cat: r.cat, note: r.name, date: TODAY, c: Date.now() });
    commit(); toast("Pengeluaran rutin dicatat");
  }
  else if (a === "cal") { calSel = el.dataset.d; render(); }
  else if (a === "cal-prev" || a === "cal-next") {
    calOff += a === "cal-next" ? 1 : -1;
    var nn = new Date(), bb = new Date(nn.getFullYear(), nn.getMonth() + calOff, 1);
    calSel = calOff === 0 ? TODAY : ymd(bb); render();
  }
  else if (a === "shop-new") shopForm(null);
  else if (a === "shop-edit") shopForm(byId(S.shop, id));
  else if (a === "shop-toggle") { var si = byId(S.shop, id); si.done = !si.done; commit(); }
  else if (a === "shop-done") {
    var items = S.shop.filter(function (s) { return s.done; }), tot = shopTotals().done;
    if (!items.length) { toast("Centang barang yang sudah dibeli dulu"); return; }
    if (tot <= 0) { toast("Isi perkiraan harga barang yang dicentang"); return; }
    S.tx.push({ id: uid(), type: "expense", amount: tot, cat: "Belanja dapur", note: "Belanja " + items.length + " barang", date: TODAY, c: Date.now() });
    S.shop = S.shop.filter(function (s) { return !s.done; });
    commit(); toast("Belanja " + rp(tot) + " dicatat");
  }
  else if (a === "stk-new") stockForm(null);
  else if (a === "stk-edit") stockForm(byId(S.stock, id));
  else if (a === "stk") { var st = byId(S.stock, id); st.qty = Math.max(0, Math.round((st.qty + parseInt(el.dataset.d, 10)) * 100) / 100); commit(); }
  else if (a === "stk-shop") {
    var n1 = addToShop(S.stock.filter(function (s) { return s.qty <= s.min; }).map(function (s) { return s.name + " (" + s.unit + ")"; }));
    commit(); toast(n1 ? n1 + " barang masuk daftar belanja" : "Tidak ada barang baru untuk ditambahkan");
  }
  else if (a === "meal-edit") {
    var dn = el.dataset.d, m = S.meals[dn] || { menu: "", bahan: "" };
    openForm({
      title: "Menu hari " + DOW[dn - 1], ok: "Menu disimpan",
      fields: [{ id: "menu", label: "Menu masakan", type: "text", value: m.menu, ph: "Contoh: nasi, ayam goreng, sayur" }, { id: "bahan", label: "Bahan yang perlu dibeli (pisahkan dengan koma)", type: "text", value: m.bahan, ph: "ayam, kangkung, bawang" }],
      save: function (v) { S.meals[dn] = { menu: v.menu, bahan: v.bahan }; }
    });
  }
  else if (a === "meal-shop") {
    var names = []; Object.keys(S.meals).forEach(function (k) { names = names.concat((S.meals[k].bahan || "").split(",")); });
    var n2 = addToShop(names); commit(); toast(n2 ? n2 + " bahan masuk daftar belanja" : "Tidak ada bahan baru untuk ditambahkan");
  }
  else if (a === "ch-new") choreForm(null);
  else if (a === "ch-edit") choreForm(byId(S.chores, id));
  else if (a === "ch-toggle") { var c = byId(S.chores, id); c.doneOn = c.doneOn === TODAY ? "" : TODAY; commit(); }
});
$("#fx").innerHTML = svg("x", 20);
$("#xbtn").innerHTML = svg("x", 20);
if (!load()) { seed(); save(); }
else if (!S.v2) { if (S.sample) seed(); else seedExtras(); save(); }
ensureExtras();
applyTheme(); render();
