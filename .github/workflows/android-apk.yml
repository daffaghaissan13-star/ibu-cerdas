name: Buat APK Android

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Siapkan folder web
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/
          cp -r icons www/icons

      - name: Pasang Capacitor
        run: npm install

      - name: Buat proyek Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Bangun APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: ibu-cerdas-apk
          path: android/app/build/outputs/apk/debug/app-debug.app
